"""
Information of a specific order.
"""
type StoreOrder {
  """
  ID of the order in [VTEX order management](https://help.vtex.com/en/tutorial/license-manager-resources-oms--60QcBsvWeum02cFi3GjBzg#).
  """
  orderNumber: String!
  """
  Array with information on each accepted offer.
  """
  acceptedOffer: [StoreOffer!]!
  """
  Indicates whether or not items with attachments should be split.
  """
  shouldSplitItem: Boolean
  """
  Sales channel of the underlying orderForm when FastStore adopted it after an
  external cart change (e.g. Quick Order). Null on ordinary validations where
  no SC adoption happened. Optional — existing clients that omit this field
  are unaffected.
  """
  salesChannel: String
}

"""
Order input.
"""
input IStoreOrder {
  """
  ID of the order in [VTEX order management](https://help.vtex.com/en/tutorial/license-manager-resources-oms--60QcBsvWeum02cFi3GjBzg#).
  """
  orderNumber: String!
  """
  Array with information on each accepted offer.
  """
  acceptedOffer: [IStoreOffer!]!
  """
  Indicates whether or not items with attachments should be split.
  """
  shouldSplitItem: Boolean
}

type PickupPointAddress {
  """
  Address city.
  """
  city: String
  """
  Address neighborhood.
  """
  neighborhood: String
  """
  Address number.
  """
  number: String
  """
  Address postal code.
  """
  postalCode: String
  """
  Address street.
  """
  street: String
  """
  Address state.
  """
  state: String
}

type BusinessHour {
  """
  Number that represents the day of the week.
  """
  dayOfWeek: Int
  """
  Business hour opening time.
  """
  openingTime: String
  """
  Business hour closing time.
  """
  closingTime: String
}

type PickupPointDistance {
  """
  Pickup point ID.
  """
  pickupId: String
  """
  Pickup point distance.
  """
  distance: Float
  """
  Pickup point name.
  """
  pickupName: String
  """
  Whether the pickup point is active.
  """
  isActive: Boolean
  """
  Pickup point address.
  """
  address: PickupPointAddress
  """
  Pickup point business hours.
  """
  businessHours: [BusinessHour]
}

type PickupPoints {
  """
  List of pickup point distances for the given location.
  """
  pickupPointDistances: [PickupPointDistance]
  """
  Not returned by Intelligent Search pickup-point-availability. Always null.
  """
  pickupPointsHash: String
    @deprecated(
      reason: "Not returned by Intelligent Search pickup-point-availability. Always null."
    )
}

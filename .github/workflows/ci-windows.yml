# Runs @faststore/cli on Windows, the only platform where the path-handling
# bugs we keep shipping to partners (#3337, #3419, #3440) can actually fail.
#
# Unit tests alone would not have caught those bugs (dev/build/generate-types
# had no coverage). The job also packs the workspace and builds starter.store,
# which is where the CLI is actually invoked.
#
# Scoped to packages/cli for now: we do not know the Windows runner cost yet,
# and most monorepo changes land in core. workflow_dispatch covers breaks
# that originate outside the CLI.
#
# The remote Turbo cache is deliberately left out so the run reflects a real
# Windows build instead of restoring artifacts produced on Linux.
#
# Not a required check yet: that is a branch protection decision, taken once
# the job has proven stable against starter.store and Yarn.
name: CI (Windows)

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'packages/cli/**'
      - '.github/workflows/ci-windows.yml'
  # The paths filter above is also a blind spot: a Windows-only break coming
  # from outside packages/cli never triggers this job. Manual dispatch is the
  # escape hatch for those cases.
  workflow_dispatch:

permissions:
  contents: read

# Only the tip of a branch is worth testing: a burst of pushes should leave one
# run standing, not one per push.
concurrency:
  group: ci-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: CLI + starter (Windows)
    timeout-minutes: 45
    runs-on: windows-latest
    # Do not switch this job to bash before fixing `process.env.PWD` in the vite
    # configs: Git Bash sets PWD to an MSYS path (/d/a/...), which is not a valid
    # Windows path, and the builds fail on entry resolution.
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.0

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm i

      # Packing before a full build ships empty dist/ folders: only
      # @faststore/cli has a prepack that rebuilds itself.
      - name: Build
        run: pnpm build

      - name: Test @faststore/cli
        run: pnpm turbo run test --filter=@faststore/cli

      # GitHub only propagates the exit code of the last command in a block, so
      # a failed pack in the middle of the loop has to be surfaced by hand.
      - name: Pack packages
        run: |
          New-Item -ItemType Directory -Force -Path packed-packages | Out-Null
          Get-ChildItem packages -Directory | ForEach-Object {
            Push-Location $_.FullName
            pnpm pack --pack-destination ../../packed-packages
            $code = $LASTEXITCODE
            Pop-Location
            if ($code -ne 0) { exit $code }
          }

      - name: Clone starter
        run: git clone --depth 1 https://github.com/vtex-sites/starter.store.git starter

      - name: Install specific Yarn version
        run: npm install -g yarn@1.22.19 # https://github.com/yarnpkg/yarn/issues/9015

      - name: Verify Yarn version
        run: yarn --version

      # Yarn 1 resolutions must be relative POSIX paths: an absolute Windows
      # path is parsed as a protocol because of the drive letter.
      - name: Install the packages on starter
        run: |
          Set-Location starter
          Get-ChildItem ../packed-packages/*.tgz | ForEach-Object {
            $name = '@faststore/' + ($_.BaseName -split '-')[1]
            node ../scripts/set-resolution.js . $name ('../packed-packages/' + $_.Name)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Install dependencies in starter
        run: |
          Set-Location starter
          yarn install

      # TEMPORARY: diagnosing "Cannot find module 'src/pages/s'" during
      # `next build`'s TypeScript check on Windows. Remove once root-caused.
      - name: Diagnose src/pages/s.tsx resolution
        run: |
          Set-Location starter
          Write-Host "--- cwd ---"
          Get-Location
          Write-Host "--- .faststore/src/pages listing ---"
          Get-ChildItem .faststore\src\pages -ErrorAction SilentlyContinue | Select-Object Name, FullName, Length
          Write-Host "--- Exists checks (relative from starter/.faststore) ---"
          Set-Location .faststore
          Write-Host "Test-Path src\pages\s.tsx : $(Test-Path 'src\pages\s.tsx')"
          Write-Host "Test-Path src/pages/s.tsx : $(Test-Path 'src/pages/s.tsx')"
          Write-Host "Resolve-Path src\pages\s.tsx :"
          Resolve-Path 'src\pages\s.tsx' -ErrorAction SilentlyContinue
          Write-Host "--- tsconfig.json baseUrl/rootDir/paths ---"
          Get-Content tsconfig.json | Select-String -Pattern "baseUrl|rootDir|\`"paths\`"|src/\*" -Context 0,1
          Write-Host "--- next.config.js outputFileTracingRoot ---"
          Get-Content next.config.js | Select-String -Pattern "outputFileTracingRoot|turbopack"
          Write-Host "--- node resolves it? ---"
          node -e "console.log(require('path').resolve(process.cwd(), 'src/pages/s.tsx')); console.log(require('fs').existsSync('src/pages/s.tsx'))"
          Set-Location ..

      - name: Build starter
        run: |
          Set-Location starter
          yarn build

      # A Windows-only failure is hard to reproduce on the team's machines, and
      # the runner state is gone once the job ends.
      - name: Upload starter diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: starter-windows-${{ github.run_id }}
          path: |
            starter/package.json
            starter/.faststore/
          retention-days: 7
          if-no-files-found: ignore
